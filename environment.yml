name: crypto_trading
channels:
  - conda-forge
dependencies:
  # Keep the native dataframe/Parquet stack from one binary distribution on
  # Windows.  Mixing a pip PyArrow wheel with Conda's MSVC runtime caused
  # repeatable access violations in the long-running service.
  - python=3.11
  - pip
  - pyarrow=24.0.*
  - numpy=1.26.*
  - pandas=2.3.*
  # Security-sensitive native wheels stay on the same conda-forge runtime.
  - aiohttp>=3.14.4,<4
  - multidict>=6.9.1,<7
  - pillow>=13.0.0,<14
  - tornado>=6.5.9,<7
  - pip:
      - -r requirements.txt
