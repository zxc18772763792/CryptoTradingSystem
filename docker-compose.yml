# docker-compose.yml - Compose Spec (no `version:` key required for Compose v2)
#
# Required environment variables (fail-fast if unset):
#   POSTGRES_PASSWORD          Postgres password for the `crypto` user
#   REDIS_PASSWORD             Redis AUTH password
#   GRAFANA_ADMIN_PASSWORD     Grafana admin password
#
# Optional:
#   POSTGRES_USER (default: crypto)
#   POSTGRES_DB   (default: crypto_trading)
#
# Network model: services communicate over the internal `crypto_net` network.
# The operator UI binds to 0.0.0.0 inside the container but is published only
# on host loopback. Use SSH/VPN tunnels or an authenticated reverse proxy for
# external access.

services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - TRADING_MODE=paper
      - WEB_HOST=0.0.0.0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}@db:5432/${POSTGRES_DB:-crypto_trading}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD env var is required}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    depends_on:
      - db
      - redis
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - crypto_net

  news_service:
    build: .
    command: ["python", "-m", "core.news.service.worker"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}@db:5432/${POSTGRES_DB:-crypto_trading}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD env var is required}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    depends_on:
      - db
      - redis
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - crypto_net
    profiles:
      - news_service

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-crypto}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}
      - POSTGRES_DB=${POSTGRES_DB:-crypto_trading}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - crypto_net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD env var is required}"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - crypto_net

  prometheus:
    image: prom/prometheus:latest
    expose:
      - "9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - crypto_net
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD env var is required}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - crypto_net
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  crypto_net:
    driver: bridge
