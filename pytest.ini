# pytest configuration.
#
# NOTE: `timeout` requires the `pytest-timeout` plugin. If it is missing
# from requirements.txt, install with:
#     pip install pytest-timeout
# and add it to requirements.txt. Without the plugin pytest will simply ignore
# the `timeout` option (no error), so this remains a soft requirement.
#
# The per-test budget is a hang-catcher, not a perf gate: a genuine hang is
# unbounded so 120s still catches it, while heavy integration tests (Starlette
# TestClient routes, factor-library builds, ML paths) legitimately take tens of
# seconds and can 2-4x under host load. pytest-timeout's thread method os._exit()s
# the whole process on a single overrun (no summary, suite aborts), so this must
# be generous enough not to false-fire. Was 60s; raised to 120s after two
# different heavy tests flaked at 60s purely under load (both <10-50s alone).
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
timeout = 120
addopts = -p no:pytest_ethereum --strict-markers --tb=short
markers =
    anyio: marks tests that run under the anyio pytest plugin
    asyncio: marks async tests (handled by asyncio_mode = auto; explicit marker also accepted)
    slow: marks tests as slow (deselect with -m "not slow")
    live: requires live exchange connectivity (deselect with -m "not live")
    integration: cross-module integration test
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:ccxt.*
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:websockets.*
    ignore::DeprecationWarning:aiohttp.*
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning:sqlalchemy.*
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:fontTools\.misc\.py23

[tool:mypy]
python_version = 3.11
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool:black]
line-length = 100
target-version = ['py311']

[tool:isort]
profile = black
line_length = 100
